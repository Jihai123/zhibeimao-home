name: Verify site build and responsive UI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check
        run: npm run build
      - name: Install browser QA runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          google-chrome --version
      - name: Install Chinese fonts for faithful screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Start isolated local preview
        run: |
          npm run start -- -p 3000 >/tmp/zhibeimao-next-start.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/zhibeimao-next-start.log
          exit 1
      - name: Test responsive API pages in Chromium
        run: node scripts/qa-api-product.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-preview-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: ignore
