name: Weekly growth review (ledger)

# Every Monday 10:00 Asia/Shanghai. Posts one consolidated, evidence-only
# comment to the inherited operations ledger (issue #27).
on:
  schedule:
    - cron: '0 2 * * MON'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture public production snapshot
        run: python3 scripts/growth-seo-audit.py growth-snapshot.json
      - name: Build weekly review from real observations
        run: python3 scripts/make-growth-review.py growth-snapshot.json weekly growth-review.md
      - name: Post review to operations ledger
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('growth-review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 27,
              body
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-growth-review-${{ github.run_id }}
          path: |
            growth-snapshot.json
            growth-review.md
          retention-days: 45
