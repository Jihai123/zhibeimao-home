name: Daily growth operations audit

# 09:00 Asia/Shanghai. Read-only public GETs; no credentials, no writes to production.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture public production snapshot (both sites)
        run: python3 scripts/growth-seo-audit.py growth-snapshot.json
      - name: Gate deployed invariants and report pending items
        run: python3 scripts/verify-growth-snapshot.py growth-snapshot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-snapshot-${{ github.run_id }}
          path: growth-snapshot.json
          retention-days: 45
