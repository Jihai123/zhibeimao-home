name: Verify API pricing production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-api-pricing-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-pricing-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live API pricing and unchanged pages
        run: |
          node <<'NODE'
          const base = 'https://www.zhibeimao.com';
          const pages = [
            {
              path: '/api',
              mustHave: ['美元 API 额度', '人民币优惠购买', '5.0', '4.5', '4.1',
                '美元额度通用 Key', '面值按参考汇率折合约',
                '不代表各模型调用费用比官方 API 便宜相同比例']
            },
            { path: '/', mustHave: ['在线体验与 API 接入', 'librechat.chatgpt5x.com'] },
            { path: '/api/docs', mustHave: ['/v1/chat/completions', '/v1/models'] }
          ];

          async function runOnce() {
            for (const item of pages) {
              const response = await fetch(base + item.path + '?pricing-smoke=' + Date.now(), {
                headers: { 'Cache-Control': 'no-cache', 'User-Agent': 'Mozilla/5.0' },
                signal: AbortSignal.timeout(15000)
              });
              if (response.status !== 200) throw new Error(item.path + ' returned ' + response.status);
              const html = await response.text();
              for (const token of item.mustHave) {
                if (!html.includes(token)) throw new Error(item.path + ' missing text: ' + token);
              }
              console.log('PASS ' + item.path + ' status 200, bytes=' + html.length);
            }
          }

          (async () => {
            for (let n = 1; n <= 6; n++) {
              try {
                await runOnce();
                console.log('PASS API discount production smoke');
                return;
              } catch (error) {
                console.error('attempt ' + n + ': ' + error.message);
                if (n === 6) throw error;
                await new Promise((resolve) => setTimeout(resolve, 12000));
              }
            }
          })().catch((error) => {
            console.error('FAIL API discount production smoke: ' + error.message);
            process.exitCode = 1;
          });
          NODE
